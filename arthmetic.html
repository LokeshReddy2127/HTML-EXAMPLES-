<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Example</title>

    <style>
        .error {
            color: red;
            font-size: 0.8em;
        }

        .arithmetic {
            margin-top: 30px;
        }

        .arithmetic input {
            margin: 5px;
            padding: 5px;
        }

        .arithmetic button {
            margin: 5px;
            padding: 7px 12px;
        }

        #result {
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <h1>Registration Form</h1>

    <form id="registrationForm">

        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username">
            <div id="usernameError" class="error"></div>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <div id="emailError" class="error"></div>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <div id="passwordError" class="error"></div>
        </div>

        <button type="submit">Register</button>
    </form>


    <!-- Arithmetic Operations -->
    <div class="arithmetic">
        <h2>Arithmetic Operations</h2>

        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">

        <br>

        <button type="button" onclick="add()">Addition (+)</button>
        <button type="button" onclick="subtract()">Subtraction (-)</button>
        <button type="button" onclick="multiply()">Multiplication (*)</button>
        <button type="button" onclick="divide()">Division (/)</button>

        <p>Result: <span id="result">0</span></p>
    </div>


    <script src="validation.js"></script>

    <script>
        function getNumbers() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            return [num1, num2];
        }

        function add() {
            let [num1, num2] = getNumbers();
            document.getElementById("result").textContent = num1 + num2;
        }

        function subtract() {
            let [num1, num2] = getNumbers();
            document.getElementById("result").textContent = num1 - num2;
        }

        function multiply() {
            let [num1, num2] = getNumbers();
            document.getElementById("result").textContent = num1 * num2;
        }

        function divide() {
            let [num1, num2] = getNumbers();

            if (num2 === 0) {
                document.getElementById("result").textContent =
                    "Cannot divide by zero";
            } else {
                document.getElementById("result").textContent = num1 / num2;
            }
        }
    </script>

</body>
</html>
